<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mi Ruta+</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  :root {
    --ink: #14201b;
    --paper: #f6f7f4;
    --line: #dde3d8;
    --accent: #1f6e4f;
    --accent-dim: #e4efe8;
    --brand: #0e2f24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  header {
    padding: 18px 20px 14px;
    background: var(--brand);
    color: white;
  }
  header .brand { display: flex; align-items: baseline; gap: 6px; }
  header h1 { font-size: 19px; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
  header .plus { color: #8fe3b8; font-weight: 800; }
  header span.tagline { font-size: 13px; color: #b9c9c0; display: block; margin-top: 2px; }
  #map { height: 48vh; width: 100%; }
  .panel { padding: 16px 20px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: #6b756f; margin: 0 0 10px; font-weight: 700; }
  select, button {
    font: inherit;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: white;
  }
  select { width: 100%; margin-bottom: 12px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
    width: 100%;
    font-weight: 700;
  }
  .unit-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 10px;
    background: white;
    box-shadow: 0 1px 2px rgba(14, 47, 36, 0.04);
  }
  .unit-card-top { display: flex; justify-content: space-between; align-items: center; }
  .unit-card .plate { font-weight: 800; }
  .unit-card .driver { font-size: 13px; color: #6b756f; }
  .eta-badge {
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 13px;
  }
  .eta-badge.large {
    display: block;
    text-align: center;
    font-size: 17px;
    padding: 12px;
    border-radius: 12px;
    margin: 12px 0;
  }
  .board-btn {
    width: 100%;
    padding: 9px;
    font-size: 13px;
    background: white;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
  }
  .secondary-btn {
    width: 100%;
    padding: 11px;
    background: white;
    color: #6b756f;
    border: 1px solid var(--line);
  }
  .board-panel-title { font-weight: 800; margin: 0 0 8px; }
  .field-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #6b756f;
    display: block;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .empty { color: #6b756f; font-size: 14px; }
  .stop-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .stop-banner button {
    width: auto;
    padding: 6px 10px;
    font-size: 12px;
    background: white;
    color: var(--accent);
    border: 1px solid var(--accent);
    font-weight: 700;
  }
  .maplibregl-popup-content { font-family: inherit; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Mi Ruta<span class="plus">+</span></h1>
  </div>
  <span class="tagline">Elige tu ruta y ve la unidad acercarse</span>
</header>

<div class="panel">
  <select id="routeSelect"></select>
</div>

<div id="map"></div>

<div class="panel">
  <div id="stopBanner" class="stop-banner">
    <span id="stopBannerText">Ubicando tu parada más cercana…</span>
    <button id="relocateBtn">Reintentar</button>
  </div>
  <h2>Unidades en camino</h2>
  <div id="unitsList" class="empty">Selecciona una ruta para ver las unidades activas.</div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
const API = '';
const socket = io();

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [-117.02, 32.52],
  zoom: 12,
  attributionControl: true,
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');

let stopMarkers = [];
let unitMarkers = {}; // unitId -> maplibregl.Marker
let currentRouteId = null;
let currentStops = [];
let activeUnits = [];
let passengerStop = null;
let passengerMarker = null;
let boardedUnitId = null;
let destinationStop = null;

function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function locatePassenger() {
  const bannerText = document.getElementById('stopBannerText');
  if (!navigator.geolocation) {
    bannerText.textContent = 'Tu navegador no soporta geolocalización. Mostrando ETA a la primera parada.';
    passengerStop = null;
    renderUnitsList();
    return;
  }
  bannerText.textContent = 'Ubicando tu parada más cercana…';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      if (!currentStops.length) return;
      let best = currentStops[0];
      let bestDist = Infinity;
      currentStops.forEach(stop => {
        const d = distanceKm(pos.coords.latitude, pos.coords.longitude, stop.lat, stop.lng);
        if (d < bestDist) { bestDist = d; best = stop; }
      });
      passengerStop = best;
      bannerText.textContent = `Tu parada: ${best.name} (a ${bestDist.toFixed(2)} km de ti)`;

      if (passengerMarker) passengerMarker.remove();
      const el = document.createElement('div');
      el.style.cssText = 'width:16px;height:16px;border-radius:50%;background:#2f6fed;border:3px solid white;box-shadow:0 0 0 1px #2f6fed;';
      passengerMarker = new maplibregl.Marker({ element: el })
        .setLngLat([pos.coords.longitude, pos.coords.latitude])
        .setPopup(new maplibregl.Popup().setText('Tú estás aquí'))
        .addTo(map);

      renderUnitsList();
    },
    () => {
      bannerText.textContent = 'No se pudo obtener tu ubicación. Mostrando ETA a la primera parada.';
      passengerStop = null;
      renderUnitsList();
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

document.getElementById('relocateBtn').addEventListener('click', locatePassenger);

async function loadRoutes() {
  const res = await fetch(`${API}/api/routes`);
  const routes = await res.json();
  const select = document.getElementById('routeSelect');
  select.innerHTML = routes.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
  select.addEventListener('change', () => selectRoute(select.value));
  if (routes.length) selectRoute(routes[0].id);
}

async function selectRoute(routeId) {
  if (currentRouteId) socket.emit('unsubscribe_route', currentRouteId);
  currentRouteId = routeId;
  socket.emit('subscribe_route', routeId);

  stopMarkers.forEach(m => m.remove());
  stopMarkers = [];
  Object.values(unitMarkers).forEach(m => m.remove());
  unitMarkers = {};

  const stopsRes = await fetch(`${API}/api/routes/${routeId}/stops`);
  currentStops = await stopsRes.json();

  const bounds = new maplibregl.LngLatBounds();
  currentStops.forEach(stop => {
    const el = document.createElement('div');
    el.style.cssText = 'width:12px;height:12px;border-radius:50%;background:#1f6e4f;border:2px solid white;box-shadow:0 0 0 1px #1f6e4f;';
    const marker = new maplibregl.Marker({ element: el })
      .setLngLat([stop.lng, stop.lat])
      .setPopup(new maplibregl.Popup().setText(stop.name))
      .addTo(map);
    stopMarkers.push(marker);
    bounds.extend([stop.lng, stop.lat]);
  });
  if (currentStops.length) {
    map.fitBounds(bounds, { padding: 50, duration: 500 });
  }

  await loadActiveUnits();
  locatePassenger();
}

async function loadActiveUnits() {
  const res = await fetch(`${API}/api/units/active`);
  const all = await res.json();
  activeUnits = all.filter(u => String(u.route_id) === String(currentRouteId));
  renderUnitsList();
  activeUnits.forEach(u => {
    if (u.position) placeUnitMarker(u.unit_id, u.position.lat, u.position.lng);
  });
}

function placeUnitMarker(unitId, lat, lng) {
  if (unitMarkers[unitId]) {
    unitMarkers[unitId].setLngLat([lng, lat]);
  } else {
    const el = document.createElement('div');
    el.style.cssText = 'width:16px;height:16px;border-radius:50%;background:#1f6e4f;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);';
    unitMarkers[unitId] = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
  }
}

function etaMinutesTo(lat, lng, destLat, destLng, speedKmh = 18) {
  const distanceKm2 = distanceKm(lat, lng, destLat, destLng);
  return Math.round((distanceKm2 / speedKmh) * 60);
}

function renderUnitsList() {
  const list = document.getElementById('unitsList');

  if (boardedUnitId) {
    renderBoardingPanel(list);
    return;
  }

  if (!activeUnits.length) {
    list.className = 'empty';
    list.textContent = 'No hay unidades activas en esta ruta por ahora.';
    return;
  }
  list.className = '';
  list.innerHTML = activeUnits.map(u => {
    let etaText = 'Ubicando…';
    const targetStop = passengerStop || currentStops[0];
    if (u.position && targetStop) {
      const mins = etaMinutesTo(u.position.lat, u.position.lng, targetStop.lat, targetStop.lng);
      etaText = `${mins} min a tu parada`;
    }
    return `<div class="unit-card" data-unit="${u.unit_id}">
      <div class="unit-card-top">
        <div>
          <div class="plate">Unidad ${u.plate}</div>
          <div class="driver">Chofer: ${u.driver_name}</div>
        </div>
        <div class="eta-badge">${etaText}</div>
      </div>
      <button class="board-btn" onclick="boardUnit(${u.unit_id})">Ya me subí a esta unidad</button>
    </div>`;
  }).join('');
}

function boardUnit(unitId) {
  boardedUnitId = unitId;
  destinationStop = null;
  renderUnitsList();
}
window.boardUnit = boardUnit;

function renderBoardingPanel(list) {
  const unit = activeUnits.find(u => u.unit_id === boardedUnitId);
  if (!unit) {
    list.className = 'empty';
    list.textContent = 'Esta unidad ya no está activa.';
    boardedUnitId = null;
    destinationStop = null;
    return;
  }

  let options = currentStops;
  if (passengerStop) {
    const idx = currentStops.findIndex(s => s.id === passengerStop.id);
    if (idx >= 0 && idx < currentStops.length - 1) options = currentStops.slice(idx + 1);
  }
  if (!options.length) options = currentStops;
  if (!destinationStop || !options.some(s => s.id === destinationStop.id)) {
    destinationStop = options[options.length - 1] || options[0];
  }

  let etaText = 'Calculando…';
  if (unit.position && destinationStop) {
    const mins = etaMinutesTo(unit.position.lat, unit.position.lng, destinationStop.lat, destinationStop.lng);
    etaText = `${mins} min a tu destino`;
  }

  list.className = '';
  list.innerHTML = `
    <div class="unit-card">
      <p class="board-panel-title">Vas en la unidad ${unit.plate} · Chofer: ${unit.driver_name}</p>
      <label class="field-label" for="destinationSelect">¿A dónde vas?</label>
      <select id="destinationSelect">
        ${options.map(s => `<option value="${s.id}" ${destinationStop.id === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
      </select>
      <div class="eta-badge large">${etaText}</div>
      <button class="secondary-btn" id="exitBoardBtn">Ya bajé / cancelar</button>
    </div>
  `;

  document.getElementById('destinationSelect').addEventListener('change', (e) => {
    destinationStop = options.find(s => String(s.id) === e.target.value) || destinationStop;
    renderUnitsList();
  });
  document.getElementById('exitBoardBtn').addEventListener('click', () => {
    boardedUnitId = null;
    destinationStop = null;
    renderUnitsList();
  });
}

socket.on('location_update', (data) => {
  const unit = activeUnits.find(u => u.unit_id === data.unitId);
  if (!unit) return;
  unit.position = { lat: data.lat, lng: data.lng };
  placeUnitMarker(data.unitId, data.lat, data.lng);
  renderUnitsList();
});

map.on('load', loadRoutes);
</script>
</body>
</html>
