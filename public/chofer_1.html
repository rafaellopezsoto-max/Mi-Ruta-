<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mi Ruta+ — Chofer</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1c2b26;
    color: white;
    min-height: 100vh;
  }
  .top {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 24px 16px;
    text-align: center;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p { color: #b7c2bc; font-size: 14px; margin-top: 0; }
  input {
    width: 100%;
    max-width: 280px;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin: 16px 0;
    font-size: 16px;
    text-align: center;
  }
  select {
    width: 100%;
    max-width: 280px;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin: 8px 0 0;
    font-size: 15px;
    text-align: center;
    background: white;
    color: #1c2b26;
  }
  label.field-label {
    font-size: 12px;
    color: #b7c2bc;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 12px;
    display: block;
  }
  button {
    padding: 16px 32px;
    border-radius: 999px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: #2f8f66;
    color: white;
  }
  button.stop { background: #a5423a; }
  #status { margin-top: 20px; font-size: 13px; color: #b7c2bc; }
  #dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; margin-right: 6px; background: #666;
  }
  #dot.live { background: #4ade80; }

  .passengers-panel { padding: 0 20px 24px; }
  .passengers-panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #b7c2bc;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .passenger-count {
    background: #2f8f66;
    color: white;
    font-weight: 800;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
  }
  #map { height: 42vh; width: 100%; border-radius: 14px; overflow: hidden; }
  .maplibregl-popup-content { font-family: inherit; font-size: 13px; color: #1c2b26; }
  .empty-passengers { color: #b7c2bc; font-size: 13px; padding: 12px 0; }
</style>
</head>
<body>
  <div class="top">
    <h1>Transmitir mi ubicación</h1>
    <p>Deja esta pantalla abierta mientras conduces tu ruta</p>

    <input id="unitId" type="number" placeholder="ID de tu unidad (ej. 1)" />

    <label class="field-label" for="routeSelect">¿Hacia dónde vas ahora?</label>
    <select id="routeSelect"></select>

    <button id="toggleBtn">Iniciar transmisión</button>

    <div id="status"><span id="dot"></span>Detenido</div>
  </div>

  <div class="passengers-panel">
    <h2>Pasajeros cercanos a tu ruta <span class="passenger-count" id="passengerCount">0</span></h2>
    <div id="map"></div>
    <div id="emptyPassengers" class="empty-passengers">Nadie ha activado "compartir ubicación" cerca de tu ruta todavía.</div>
  </div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
let watchId = null;
let currentDriverRouteId = null;

const btn = document.getElementById('toggleBtn');
const statusEl = document.getElementById('status');
const dot = document.getElementById('dot');
const routeSelect = document.getElementById('routeSelect');
const passengerCountEl = document.getElementById('passengerCount');
const emptyPassengersEl = document.getElementById('emptyPassengers');

const socket = io();

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [-117.02, 32.52],
  zoom: 11,
  attributionControl: true,
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');

// passengerId -> { marker, lastSeen }
const passengerMarkers = {};

function renderEmptyState() {
  const count = Object.keys(passengerMarkers).length;
  passengerCountEl.textContent = count;
  emptyPassengersEl.style.display = count ? 'none' : 'block';
}

function upsertPassenger(passengerId, lat, lng) {
  if (passengerMarkers[passengerId]) {
    passengerMarkers[passengerId].marker.setLngLat([lng, lat]);
    passengerMarkers[passengerId].lastSeen = Date.now();
  } else {
    const el = document.createElement('div');
    el.style.cssText = 'width:16px;height:16px;border-radius:50%;background:#2f6fed;border:3px solid white;box-shadow:0 0 0 1px #2f6fed;';
    const marker = new maplibregl.Marker({ element: el })
      .setLngLat([lng, lat])
      .setPopup(new maplibregl.Popup().setText('Pasajero esperando'))
      .addTo(map);
    passengerMarkers[passengerId] = { marker, lastSeen: Date.now() };
  }
  renderEmptyState();
}

function removePassenger(passengerId) {
  if (passengerMarkers[passengerId]) {
    passengerMarkers[passengerId].marker.remove();
    delete passengerMarkers[passengerId];
    renderEmptyState();
  }
}

function clearAllPassengers() {
  Object.keys(passengerMarkers).forEach(removePassenger);
}

socket.on('passenger_update', ({ passengerId, lat, lng }) => {
  upsertPassenger(passengerId, lat, lng);
});

socket.on('passenger_left', ({ passengerId }) => {
  removePassenger(passengerId);
});

// Limpia pasajeros que dejaron de mandar señal (sin evento explícito de salida)
setInterval(() => {
  const now = Date.now();
  Object.keys(passengerMarkers).forEach(id => {
    if (now - passengerMarkers[id].lastSeen > 30000) removePassenger(id);
  });
}, 10000);

function subscribeDriverRoute(routeId) {
  if (currentDriverRouteId) {
    socket.emit('unsubscribe_driver_route', currentDriverRouteId);
    clearAllPassengers();
  }
  currentDriverRouteId = routeId;
  if (routeId) socket.emit('subscribe_driver_route', routeId);
}

async function loadRoutes() {
  const res = await fetch('/api/routes');
  const routes = await res.json();
  routeSelect.innerHTML = routes.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
  if (routes.length) subscribeDriverRoute(routes[0].id);
}
loadRoutes();

routeSelect.addEventListener('change', () => {
  subscribeDriverRoute(routeSelect.value);
});

btn.addEventListener('click', () => {
  if (watchId) {
    stop();
  } else {
    start();
  }
});

function start() {
  const unitId = document.getElementById('unitId').value;
  if (!unitId) {
    alert('Escribe el ID de tu unidad primero');
    return;
  }
  if (!navigator.geolocation) {
    alert('Este navegador no soporta geolocalización');
    return;
  }
  watchId = navigator.geolocation.watchPosition(
    (pos) => sendLocation(unitId, pos.coords.latitude, pos.coords.longitude),
    (err) => { statusEl.textContent = 'Error de GPS: ' + err.message; },
    { enableHighAccuracy: true, maximumAge: 4000, timeout: 10000 }
  );
  btn.textContent = 'Detener transmisión';
  btn.classList.add('stop');
  dot.classList.add('live');
  statusEl.textContent = 'Transmitiendo…';
}

function stop() {
  navigator.geolocation.clearWatch(watchId);
  watchId = null;
  btn.textContent = 'Iniciar transmisión';
  btn.classList.remove('stop');
  dot.classList.remove('live');
  statusEl.innerHTML = '<span id="dot"></span>Detenido';
}

async function sendLocation(unitId, lat, lng) {
  try {
    const routeId = routeSelect.value;
    await fetch(`/api/units/${unitId}/location`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat, lng, routeId })
    });
    statusEl.innerHTML = `<span id="dot" class="live"></span>Última señal: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  } catch (e) {
    statusEl.textContent = 'No se pudo enviar la ubicación';
  }
}
</script>
</body>
</html>
